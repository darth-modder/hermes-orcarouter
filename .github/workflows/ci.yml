name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The v0.21.5 stable release. Pinned by exact tag (not a moving branch) so
  # this job's results are reproducible; nightly.yml tracks `main` instead.
  HERMES_REF: v2026.9.24
  HERMES_EXPECTED_VERSION: "0.21.5"
  # Hermes' own top-level packages (providers, agent, hermes_cli, ...) are
  # imported straight off this checkout, matching tests/conftest.py's
  # HERMES_AGENT_DIR resolution and hermes-agent's own dev workflow -- NOT
  # via `pip install -e ./hermes-agent`. That editable install only exposes
  # the packages hermes-agent's own build backend maps (see its
  # __editable__ finder); it deliberately excludes repo-root tooling
  # directories such as `pm/`, which hermes_cli.update_channel imports at
  # module load time (`from pm.environments import ...`). Putting the
  # checkout itself on PYTHONPATH sidesteps that mapping entirely.
  PYTHONPATH: ${{ github.workspace }}/hermes-agent

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # hermes-agent's pyproject.toml at ${{ env.HERMES_REF }} declares
        # requires-python = ">=3.11,<3.14"; test 3.11 and 3.12.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out this repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check out hermes-agent @ ${{ env.HERMES_REF }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          # Full history + tags: Hermes' version resolution
          # (hermes_cli.plugins_manifest.running_hermes_version(), see
          # .github/scripts/verify_hermes_version.py) can require the release
          # tag to be present. A shallow checkout with no tags can degrade
          # that resolution to "unknown", which the permissive-version-gate
          # trap turns into an always-pass for every requires_hermes check
          # below.
          fetch-depth: 0
          path: hermes-agent

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install this plugin's dev/test dependencies
        # hermes-agent itself is never pip-installed (see the PYTHONPATH
        # comment above); this installs only the small set of third-party
        # packages its imported modules actually need on this interpreter
        # (openai, httpx, pyyaml, ruamel.yaml) plus pytest/ruff/ty.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify Hermes version resolution
        run: python .github/scripts/verify_hermes_version.py "$HERMES_EXPECTED_VERSION"

      - name: ruff
        # --exclude hermes-agent: that checkout is a sibling directory
        # inside this same workspace (see the "Check out hermes-agent"
        # step), not part of this plugin. Without the exclude, `ruff check .`
        # also lints all of hermes-agent's own source against this repo's
        # narrower rule set and banned-API list, which is neither this
        # plugin's code nor something it can fix.
        run: python -m ruff check . --config ruff.toml --exclude hermes-agent

      - name: ty
        run: python -m ty check --python "$pythonLocation" --extra-search-path ./hermes-agent --exclude hermes-agent

      - name: pytest
        env:
          REQUIRE_HERMES: "1"
          HERMES_AGENT_DIR: ./hermes-agent
        run: python -m pytest -q

      - name: hermes plugins validate (orcarouter)
        run: python .github/scripts/validate_plugin.py orcarouter

      - name: requires_hermes gate check
        run: python .github/scripts/check_requires_hermes.py orcarouter/plugin.yaml
