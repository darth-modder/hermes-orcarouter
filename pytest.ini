[pytest]
# Restrict discovery to this plugin's own suite. Without this, a bare
# `pytest` invoked from the repo root also walks into a hermes-agent
# checkout placed alongside it (e.g. CI's ./hermes-agent, per
# tests/conftest.py's HERMES_AGENT_DIR convention) and tries to collect
# hermes-agent's own test suite too -- which imports optional runtime extras
# (fastapi, uvicorn, ...) this plugin's dev environment has no reason to
# install and crashes collection.
testpaths = tests
markers =
    core_internal: depends on Hermes core internals; a failure may mean core changed, not the plugin
